# Optional: deploys the Claude-powered Supabase Edge Function without installing anything locally.
# Needs: repository SECRET  SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#        repository VARIABLE SUPABASE_PROJECT_REF  (the id in https://<ref>.supabase.co)
# The Anthropic key is NOT stored in GitHub — set it in Supabase (Edge Functions → Secrets).
name: Deploy AI function to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check configuration
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret and the SUPABASE_PROJECT_REF variable first (see SETUP.md)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # The account token is only exposed to this one step.
      - name: Deploy same-sky-ai
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy same-sky-ai --project-ref "$PROJECT_REF" --no-verify-jwt
